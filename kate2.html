<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Kate!</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(rgba(222, 193, 248, 0.6), rgba(243, 226, 252, 0.6)),
                  url('sxDKg5FdtvecNvCBeJBCx.jpeg') center/cover no-repeat;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.85);
      border: 4px solid #801299;
      box-shadow: 0 15px 25px rgba(128, 18, 153, 0.3);
      padding: 40px 60px;
      border-radius: 20px;
      max-width: 700px;
      text-align: left;
      font-size: 22px;
      color: #5d3870;
      position: relative;
      backdrop-filter: blur(5px);
    }

    .typed-text {
      display: inline;
      white-space: pre-wrap;
      min-height: 120px;
    }

    .cursor {
      display: inline-block;
      background-color: #801299;
      width: 2px;
      height: 1.2em;
      margin-left: 2px;
      animation: blink 0.7s steps(1) infinite;
      vertical-align: bottom;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="typed-text" id="typed"></span><span class="cursor" id="cursor"></span>
  </div>

  <script>
    const message = `Happy 18th birthday, Kate!
We might not get to see each other in person, but I do care about you. I might act like a jerk sometimes, but I care for you, Kate. May you have a blessed and wonderful day ahead. I wish you a healthy and wealthy life. I don’t have much else to say—just may you achieve everything you desire.



Sincerely, Rhed:)`;
    const typedEl = document.getElementById("typed");
    const cursorEl = document.getElementById("cursor");

    let index = 0;

    function type() {
      if (index < message.length) {
        typedEl.textContent += message.charAt(index);
        index++;
        setTimeout(type, 50);
      } else {
        cursorEl.style.display = "none";
      }
    }

    window.onload = type;
  </script>

</body>
<link rel="stylesheet" href="kate2.css">

</html>
